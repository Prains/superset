<!doctype html>
<meta charset="utf-8" />
<style>
  /* App Store screenshot canvas: 6.9" = 1320 x 2868, rendered 1:1. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1320px; height: 2868px; overflow: hidden;
    background: var(--bg);
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  :root {
    --bg: #f4f2ef;         /* warm off-white */
    --ink: #0b0b0c;        /* headline */
    --muted: #6f6d69;      /* subhead */
    --frame: #1c1c1e;      /* device rail */
    --frame-edge: #48474b; /* rail highlight */
  }
  .copy { padding: 150px 104px 0; }
  .line1 {
    font-size: 104px; line-height: 1.02; font-weight: 700;
    letter-spacing: -0.035em; color: var(--ink);
  }
  .line2 {
    margin-top: 14px;
    font-size: 84px; line-height: 1.08; font-weight: 500;
    letter-spacing: -0.035em; color: var(--muted);
    max-width: 1060px;
  }

  /* Device sits low and bleeds off the bottom edge. */
  .device {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: 660px; width: 1040px; height: 2400px;
    background: linear-gradient(150deg, var(--frame-edge), var(--frame) 22%, var(--frame) 78%, var(--frame-edge));
    border-radius: 108px; padding: 16px;
    box-shadow: 0 60px 120px rgba(20, 18, 14, 0.22), 0 8px 24px rgba(20, 18, 14, 0.12);
  }
  .screen {
    position: relative; width: 100%; height: 100%;
    border-radius: 94px; overflow: hidden; background: #09090b;
  }
  .screen img { width: 100%; display: block; }
  .island {
    position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
    width: 260px; height: 74px; border-radius: 40px; background: #000;
  }
</style>
<div class="copy">
  <div class="line1">__LINE1__</div>
  <div class="line2">__LINE2__</div>
</div>
<div class="device">
  <div class="screen">
    <img src="__SHOT__" alt="" />
    <div class="island"></div>
  </div>
</div>
